<section class="page">
  <app-section-header
    eyebrow="Organizaciones"
    title="Registro y gestión multi-tenant"
    description="Administra organizaciones, datos de contacto y estado operativo para segmentar usuarios y documentos."
    actionLabel="Registrar organización"
    actionIcon="add_business"
    (action)="togglePanel()"
  ></app-section-header>

  <div class="toolbar">
    <app-search-bar placeholder="Buscar por NIT, nombre, correo o estado" [value]="term()" (search)="search($event)"></app-search-bar>
    <app-button label="Actualizar" icon="refresh" variant="ghost" (btnClick)="loadOrganizaciones()"></app-button>
  </div>

  <div class="content-grid">
    <app-data-table
      [columns]="columns"
      [rows]="rows()"
      emptyTitle="Sin organizaciones"
      emptyMessage="No hay organizaciones registradas."
      (edit)="editOrganizacion($event)"
    ></app-data-table>

    @if (isPanelOpen()) {
      <aside class="panel">
        <header class="panel__header">
          <div>
            <h2>{{ isEditing() ? 'Editar organización' : 'Nueva organización' }}</h2>
            <p>Datos base de la organización.</p>
          </div>
          <app-button icon="close" variant="ghost" size="sm" (btnClick)="togglePanel()"></app-button>
        </header>
        <form class="panel__body form-grid" [formGroup]="orgForm" (ngSubmit)="saveOrganizacion()">
          <div class="form-group">
            <label>NIT</label>
            <input type="number" class="form-control" formControlName="nit" placeholder="900123456">
          </div>
          <div class="form-group">
            <label>Nombre</label>
            <input type="text" class="form-control" formControlName="nombre" placeholder="Nombre legal">
          </div>
          <div class="form-group">
            <label>Correo</label>
            <input type="email" class="form-control" formControlName="email" placeholder="contacto@empresa.com">
          </div>
          <div class="form-group">
            <label>Teléfono</label>
            <input type="text" class="form-control" formControlName="telefono" placeholder="606 555 0101">
          </div>
          <div class="form-group">
            <label>Calle</label>
            <input type="text" class="form-control" formControlName="dirCalle" placeholder="Carrera 15">
          </div>
          <div class="form-group">
            <label>Número</label>
            <input type="text" class="form-control" formControlName="dirNumero" placeholder="24-10">
          </div>
          <div class="form-group">
            <label>Comuna / ciudad</label>
            <input type="text" class="form-control" formControlName="dirComuna" placeholder="Armenia">
          </div>
          <label class="check-row">
            <input type="checkbox" formControlName="active">
            Organización activa
          </label>
          <app-button [label]="isEditing() ? 'Actualizar organización' : 'Guardar organización'" icon="save" variant="success" type="submit" [disabled]="isSaving() || orgForm.invalid"></app-button>
        </form>
      </aside>
    }
  </div>
</section>
