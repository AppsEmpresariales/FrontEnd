<div class="auth-container">
  <div class="auth-box">
    <div class="auth-header">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
        </svg>
        DocuCloud
      </div>
      <h2 class="auth-title">Iniciar sesión</h2>
    </div>

    @if (errorMessage()) {
      <div class="auth-error">
        {{ errorMessage() }}
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <input
          id="email-address"
          type="email"
          formControlName="email"
          [ngClass]="{'is-invalid': isFieldInvalid('email')}"
          class="form-control"
          placeholder="Correo electrónico">

        @if (isFieldInvalid('email')) {
          <span class="invalid-feedback">El correo es requerido y debe ser válido.</span>
        }
      </div>

      <div class="form-group">
        <input
          id="password"
          type="password"
          formControlName="password"
          [ngClass]="{'is-invalid': isFieldInvalid('password')}"
          class="form-control"
          placeholder="Contraseña">

        @if (isFieldInvalid('password')) {
          <span class="invalid-feedback">La contraseña es requerida.</span>
        }
      </div>

      <div class="auth-options">
        <label class="auth-checkbox">
          <input type="checkbox" checked>
          Mantener sesión iniciada
        </label>
        <a href="javascript:void(0)" class="auth-link">¿Olvidaste la contraseña?</a>
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading()">
        @if (isLoading()) {
          <div class="spinner"></div>
          Procesando...
        } @else {
          INICIAR SESIÓN
        }
      </button>
    </form>

    <div class="auth-footer">
      ¿No tienes organización? <a routerLink="/register" class="auth-link">Regístrala aquí</a>
    </div>
  </div>
</div>
