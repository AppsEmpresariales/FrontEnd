<header class="section-header">
  <div>
    @if (eyebrow) {
      <span class="section-header__eyebrow">{{ eyebrow }}</span>
    }
    <h1>{{ title }}</h1>
    @if (description) {
      <p>{{ description }}</p>
    }
  </div>
  @if (actionLabel) {
    <app-button [label]="actionLabel" [icon]="actionIcon" (btnClick)="action.emit()"></app-button>
  }
</header>
